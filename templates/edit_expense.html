<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense - Hostelite Finance System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    {% include 'nav.html' %}

    <main class="container">

        <div class="page-header">
            <h1>Edit Expense</h1>
            <p>Update your expense details</p>
        </div>

        {% if error %}
            <div class="alert-error">
                {{ error }}
            </div>
        {% endif %}

        <div class="card form-card">
            <form method="POST" action="/edit-expense/{{ index }}">

                <div class="form-group">
                    <label for="name">Expense Name *</label>
                    <input type="text" id="name" name="name" value="{{ expense['name'] }}" placeholder="e.g. Dinner" required>
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <input type="text" id="category" name="category" value="{{ expense['category'] }}" placeholder="e.g. Food" required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (Rs.) *</label>
                    <input type="number" id="amount" name="amount" value="{{ expense['amount'] }}" step="any" min="0.01" placeholder="e.g. 250" required>
                </div>

                <div class="form-group">
                    <label for="payment_method">Payment Method *</label>
                    <select id="payment_method" name="payment_method" required>
                        <option value="Cash" {% if expense.get('payment_method', 'Cash') == 'Cash' %}selected{% endif %}>Cash</option>
                        <option value="Easypaisa" {% if expense.get('payment_method') == 'Easypaisa' %}selected{% endif %}>Easypaisa</option>
                        <option value="JazzCash" {% if expense.get('payment_method') == 'JazzCash' %}selected{% endif %}>JazzCash</option>
                        <option value="Bank / Card" {% if expense.get('payment_method') == 'Bank / Card' %}selected{% endif %}>Bank / Card</option>
                        <option value="Other" {% if expense.get('payment_method') == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date *</label>
                    <input type="date" id="date" name="date" value="{{ expense['date'] }}" required>
                </div>

                <div class="form-group">
                    <label for="note">Note</label>
                    <textarea id="note" name="note" rows="3" placeholder="Optional note">{{ expense['note'] }}</textarea>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">Update Expense</button>
                    <a href="/expenses" class="btn btn-secondary">Cancel</a>
                </div>

            </form>
        </div>

    </main>

</body>
</html>
