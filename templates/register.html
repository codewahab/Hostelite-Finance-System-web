<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostelite Finance - Create Account</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/hostelite-logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    {% include 'nav.html' %}

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo-badge">
                    <img src="{{ url_for('static', filename='images/hostelite-logo.png') }}"
                         onerror="this.onerror=null; this.src='{{ url_for('static', filename='images/hostelite-logo.svg') }}';"
                         alt="Hostelite Brand Icon"
                         class="auth-logo-img"
                         width="36" height="36">
                </div>
                <h2>Create Your Account</h2>
                <p>Private financial management built specifically for hostel students</p>
            </div>

            <a href="/login/google" class="btn btn-google btn-full" id="google-register-btn">
                <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.347 2.825.957 4.039l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
                </svg>
                <span>Sign up with Google</span>
            </a>

            <div class="auth-divider">
                <span>or register with username</span>
            </div>

            <form method="POST" action="/register" class="auth-form">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="username">Username (Unique handle) *</label>
                    <input type="text" id="username" name="username" value="{{ username or '' }}" placeholder="e.g. ali_khan" required autofocus autocomplete="username">
                    <small class="form-hint" style="display: block; margin-top: 3px; font-size: 11px; color: #64748b;">Letters, numbers, underscores, and dots only (min. 3 characters)</small>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label for="display_name">Your Name *</label>
                    <input type="text" id="display_name" name="display_name" value="{{ display_name or '' }}" placeholder="e.g. Ali Khan" required autocomplete="name">
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label for="confirm_password">Confirm Password *</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-type password" minlength="6" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary btn-full" style="margin-top: 6px;">Register & Start Tracking</button>
            </form>

            <div class="auth-footer">
                <span>Already have an account?</span>
                <a href="/login">Sign in &rarr;</a>
            </div>
        </div>
    </main>

</body>
</html>
